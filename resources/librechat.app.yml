resources:
  apps:
    librechat_app:
      name: ${var.app_name}
      description: "Unmodified LibreChat on Databricks Apps with Lakebase Autoscaling (PostgreSQL) for its pgvector/RAG store, ephemeral embedded MongoDB, and Unity Gateway OBO for 3-level namespace Models & MCPs"
      source_code_path: ../app
      compute_size: ${var.app_compute_size}

      # LibreChat keeps all of its state in MongoDB, and the embedded mongod
      # lives in this container. More than one instance would mean one
      # independent database (and one independent JWT secret) per replica, so
      # sessions and history would break at random. Pin to exactly one.
      # When MONGO_URI points at an external managed MongoDB, this can be raised.
      compute_min_instances: 1
      compute_max_instances: 1

      # Deploy the app in started mode so `bundle deploy` brings up compute,
      # instead of creating it stopped with no URL.
      lifecycle:
        started: true

      # Service-level scopes the On-Behalf-Of token (`x-forwarded-access-token`)
      # is allowed to exercise against Unity Gateway and Lakebase.
      #
      # Do NOT list `iam.current-user:read` / `iam.access-control:read` here.
      # Those are assigned implicitly by the platform and are rejected when
      # requested explicitly:
      #   The specified scope iam.current-user:read is not a valid scope
      #   (400 INVALID_PARAMETER_VALUE)
      # The caller's identity already arrives on every request as
      # `x-forwarded-email` / `x-forwarded-preferred-username`, alongside the
      # OBO token, with no IAM scope required.
      user_api_scopes:
        - ai-gateway
        - model-serving
        - sql
        - genie
        - files
        - vector-search
        - postgres

      # Runtime command + environment. This is the DAB-managed copy, where
      # `${var.*}` is resolved at deploy time. `app/app.yaml` carries the same
      # settings as literal values for UI-driven deploys -- bundle variables are
      # NOT interpolated inside app.yaml, so the two must be kept in sync.
      config:
        # `python`, not `python3` -- see the note in app/app.yaml. The runtime's
        # 3.11 virtualenv (where requirements.txt is installed) is on PATH as
        # `python`; `python3` may be the system 3.10 with no site-packages.
        command:
          - "python"
          - "scripts/start_app.py"
        env:
          - name: LIBRECHAT_VERSION
            value: ${var.librechat_version}

          # A loopback host means start the ephemeral MongoDB embedded in this
          # container; any other host is used as-is and is durable.
          - name: MONGO_URI
            value: ${var.mongo_uri}

          # Lakebase PostgreSQL schema for LibreChat's RAG / pgvector storage.
          - name: POSTGRES_SCHEMA
            value: "librechat,public"

          - name: UNITY_GATEWAY_DEFAULT_MODEL
            value: ${var.unity_gateway_default_model}
          - name: UNITY_GATEWAY_MODELS
            value: ${var.unity_gateway_models}
          - name: UNITY_GATEWAY_EMBEDDING_MODEL
            value: ${var.unity_gateway_embedding_model}
          - name: UNITY_GATEWAY_MCP_SERVICES
            value: ${var.unity_gateway_mcp_services}
          - name: UNITY_GATEWAY_TITLE_MODEL
            value: ${var.unity_gateway_title_model}

          # Used only to cache the downloaded mongod binary, so a cold start
          # does not depend on egress to fastdl.mongodb.org every time.
          - name: LIBRECHAT_STATE_VOLUME
            value: /Volumes/${var.state_catalog}/${var.state_schema}/${var.state_volume}

      resources:
        - name: postgres
          description: "Lakebase Autoscaling PostgreSQL database for LibreChat's pgvector / RAG storage"
          postgres:
            branch: ${resources.postgres_branches.librechat_branch.id}
            # `lakebase_database_id` is the hyphenated Lakebase resource ID,
            # not the underscored PostgreSQL database name. See databricks.yml.
            database: ${resources.postgres_branches.librechat_branch.id}/databases/${var.lakebase_database_id}
            permission: CAN_CONNECT_AND_CREATE

        - name: state-volume
          description: "UC Volume caching the mongod binary for faster, egress-independent cold starts"
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.state_catalog}.${var.state_schema}.${var.state_volume}
            permission: WRITE_VOLUME
