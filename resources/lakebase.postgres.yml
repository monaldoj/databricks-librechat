resources:
  # 1. Lakebase Autoscaling PostgreSQL Project
  postgres_projects:
    librechat_postgres:
      project_id: ${var.lakebase_project_id}
      display_name: ${var.lakebase_display_name}
      pg_version: 17

  # 2. Default 'production' branch on the Lakebase project
  #    replace_existing: true adopts the default branch auto-created with the project
  #    (which includes the default `databricks_postgres` database and `primary` endpoint)
  #    and ensures DAB orders branch readiness before binding to the App.
  postgres_branches:
    librechat_branch:
      branch_id: ${var.lakebase_branch}
      parent: ${resources.postgres_projects.librechat_postgres.id}
      no_expiry: true
      replace_existing: true

