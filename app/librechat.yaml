# =============================================================================
# LibreChat Configuration for Databricks Unity Gateway (Models & MCP Services)
# =============================================================================
# Docs:
# - Unity Gateway Overview: https://docs.databricks.com/aws/en/ai-gateway/
# - Query 3-level Model Services: https://docs.databricks.com/aws/en/ai-gateway/query-model-services
# - Query 3-level MCP Services: https://docs.databricks.com/aws/en/agents/mcp-tools/
#
# This file is a TEMPLATE. `scripts/start_app.py` renders it to
# /tmp/librechat.yaml with the live workspace host and the model / MCP services
# named by the UNITY_GATEWAY_* environment variables, then points LibreChat at
# it via CONFIG_PATH. LibreChat itself is run unmodified.
#
# IMPORTANT -- MCP `title` is validated by LibreChat against
#   ^[\p{L}\p{N}][\p{L}\p{N}\p{M}'’ -]*$
# (packages/data-provider/src/mcp.ts). Letters, digits, spaces, hyphens and
# apostrophes only: no parentheses, dots or underscores. A title that fails this
# regex makes LibreChat reject the whole config and exit at startup, so the
# three-level service name belongs in `description`, never in `title`.
version: 1.3.17
cache: true

interface:
  customWelcome: "Welcome to LibreChat on Databricks Apps — governed by Unity Gateway & backed by Lakebase Autoscaling"
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true
  mcpServers:
    placeholder: "Select Databricks Unity Gateway MCP Services"

registration:
  socialLogins: []

# SSRF exemption for the loopback Unity Gateway OBO bridge that the RAG API
# calls for embeddings (see scripts/start_app.py `handle_obo_bridge`).
mcpSettings:
  allowedAddresses:
    - "127.0.0.1:3081"

# =============================================================================
# Databricks Unity Gateway MCP Services (catalog.schema.mcp_service_name)
# =============================================================================
# Verified URL shape (returns a valid MCP `initialize` handshake):
#   POST https://<workspace-host>/ai-gateway/mcp-services/<catalog>.<schema>.<name>
#
# `startup: false` keeps these out of app-level shared connections so each
# connection is created per user, and the OBO preload hook injects that user's
# `x-forwarded-access-token`.
#
# IMPORTANT -- the KEY below must not contain dots. LibreChat names each
# model-facing tool `${toolName}_mcp_${serverName}` using this key as
# `serverName`, and Anthropic validates tool names against
#   ^[a-zA-Z0-9_-]{1,128}$
# LibreChat's own `normalizeServerName` allows `[a-zA-Z0-9_.-]`, so it passes a
# dotted key straight through and every tool-enabled Claude request fails with:
#   tools.0.custom.name: String should match pattern '^[a-zA-Z0-9_-]{1,128}$'
# So the key is the underscored form and the three-level namespace lives in
# `url` -- which is what actually routes to the service -- and `description`.
# `scripts/start_app.py` (`safe_mcp_server_key`) applies the same mapping to
# anything named in UNITY_GATEWAY_MCP_SERVICES.
mcpServers:
  system_ai_dbsql:
    type: streamable-http
    title: "Databricks SQL"
    description: "Execute governed SQL queries and explore schemas via Unity Gateway (system.ai.dbsql)"
    url: "https://${DATABRICKS_HOST}/ai-gateway/mcp-services/system.ai.dbsql"
    timeout: 120000
    initTimeout: 30000
    chatMenu: true
    startup: false
    headers:
      Authorization: "Bearer ${DATABRICKS_TOKEN}"
      x-librechat-user-email: "{{LIBRECHAT_USER_EMAIL}}"
      x-librechat-user-id: "{{LIBRECHAT_USER_ID}}"

  system_ai_genie_one_mcp:
    type: streamable-http
    title: "Databricks Genie One"
    description: "Natural-language business analytics grounded in Genie Ontology via Unity Gateway (system.ai.genie_one_mcp)"
    url: "https://${DATABRICKS_HOST}/ai-gateway/mcp-services/system.ai.genie_one_mcp"
    timeout: 120000
    initTimeout: 30000
    chatMenu: true
    startup: false
    headers:
      Authorization: "Bearer ${DATABRICKS_TOKEN}"
      x-librechat-user-email: "{{LIBRECHAT_USER_EMAIL}}"
      x-librechat-user-id: "{{LIBRECHAT_USER_ID}}"

  system_ai_web_search:
    type: streamable-http
    title: "Databricks Web Search"
    description: "Governed web search through Databricks Unity Gateway (system.ai.web_search)"
    url: "https://${DATABRICKS_HOST}/ai-gateway/mcp-services/system.ai.web_search"
    timeout: 60000
    initTimeout: 30000
    chatMenu: true
    startup: false
    headers:
      Authorization: "Bearer ${DATABRICKS_TOKEN}"
      x-librechat-user-email: "{{LIBRECHAT_USER_EMAIL}}"
      x-librechat-user-id: "{{LIBRECHAT_USER_ID}}"

# =============================================================================
# Databricks Unity Gateway Model Services (catalog.schema.model_service_name)
# =============================================================================
# Verified: POST https://<host>/ai-gateway/mlflow/v1/chat/completions with
# {"model": "system.ai.claude-sonnet-5-5", ...} returns an OpenAI-shaped 200.
#
# Unity Gateway exposes two unified, provider-agnostic APIs on this baseURL --
# `/chat/completions` and `/responses` -- and every `system.ai.claude-*` service
# lists BOTH in its `supported_api_types`. We use `/chat/completions` because it
# is what LibreChat's `custom` endpoint speaks natively, and because it is the
# *more* permissive of the two for Anthropic (it tolerates `temperature: 1`,
# which `/responses` rejects outright). "Unified" means one request shape across
# providers -- it does NOT mean the gateway normalizes away per-provider
# parameter support, so see `dropParams` below.
endpoints:
  allowedAddresses:
    - "127.0.0.1:3081"

  custom:
    - name: "Databricks Unity Gateway"
      apiKey: "${DATABRICKS_TOKEN}"
      baseURL: "https://${DATABRICKS_HOST}/ai-gateway/mlflow/v1"
      headers:
        x-librechat-user-email: "{{LIBRECHAT_USER_EMAIL}}"
        x-librechat-user-id: "{{LIBRECHAT_USER_ID}}"
      models:
        default:
          - "system.ai.claude-opus-5-5"
          - "system.ai.claude-sonnet-5-5"
          - "system.ai.claude-haiku-5-5"
          - "system.ai.gpt-5-6-sol"
        fetch: false

      # REQUIRED for the Anthropic (`system.ai.claude-*`) model services.
      #
      # LibreChat's conversation schema injects OpenAI sampling defaults on
      # EVERY request even when the user never touches a slider
      # (packages/data-provider/src/schemas.ts):
      #     temperature: 1, top_p: 1, presence_penalty: 0, frequency_penalty: 0
      # Unity Gateway forwards those to the provider, and the Anthropic model
      # services reject them, so each one is a hard 400 on every Claude call:
      #     BAD_REQUEST: Model us.anthropic.claude-sonnet-5-5 does not support
      #                  sampling parameters: top_p
      #     BAD_REQUEST: Model us.anthropic.claude-sonnet-5-5 does not support
      #                  the temperature parameter.
      #     {"message":"presence_penalty: Extra inputs are not permitted"}
      #
      # The GPT services appear to work only because LibreChat already strips
      # these for anything matching /\b(o[13]|gpt-5)(?!\.|-chat)(?:-|$)/
      # (packages/api/src/endpoints/openai/llm.ts) -- a pattern `claude-*`
      # cannot match. `dropParams` is how an administrator extends that same
      # stripping to a non-OpenAI provider; it also tells the client to hide
      # the corresponding UI controls instead of sending values that 400.
      #
      # Both spellings of each parameter are listed on purpose: LibreChat keeps
      # `knownOpenAIParams` in camelCase on `llmConfig` and passes everything
      # else through to `modelKwargs` in snake_case, and `deleteConfigParam`
      # does a literal key delete on both objects. Entries that match nothing
      # are harmless no-ops. Each entry below was confirmed to 400 against
      # `system.ai.claude-sonnet-5-5` on this gateway.
      #
      # NOTE: `response_format` is dropped because the gateway reports
      # "Structured output is not supported for this model" for these Anthropic
      # services -- it can only ever 400 here. That also disables explicit
      # structured output for the GPT models on this shared endpoint, which the
      # chat path does not use. Remove it if you add a model that needs it.
      dropParams:
        - "temperature"
        - "topP"
        - "top_p"
        - "topK"
        - "top_k"
        - "frequencyPenalty"
        - "frequency_penalty"
        - "presencePenalty"
        - "presence_penalty"
        - "logitBias"
        - "logit_bias"
        - "logprobs"
        - "topLogprobs"
        - "top_logprobs"
        - "seed"
        - "user"
        - "parallel_tool_calls"
        - "response_format"

      titleConvo: true
      titleModel: "system.ai.claude-haiku-5-5"
      summarize: false
      forcePrompt: false
      modelDisplayLabel: "Unity Gateway"
